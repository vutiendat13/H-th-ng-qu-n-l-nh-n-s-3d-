<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nghỉ phép — HDP-HRMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/modal.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  
  <div class="main-wrapper">
    <header id="topbar" class="topbar"></header>
    
    <main class="main-content">
      <div class="page-container">
        <div class="page-header">
          <h1 class="page-title">Quản lý Nghỉ phép</h1>
          <div class="page-actions">
            <button class="btn btn-primary" id="btn-add">
              <i data-lucide="plus"></i> Tạo đơn nghỉ phép
            </button>
          </div>
        </div>
        
        <div class="card">
          <div class="card-header border-bottom-0 pb-0">
            <div class="tabs w-100">
              <div class="tab-item active" data-status="">Tất cả</div>
              <div class="tab-item" data-status="PENDING">Chờ duyệt</div>
              <div class="tab-item" data-status="APPROVED">Đã duyệt</div>
              <div class="tab-item" data-status="REJECTED">Từ chối</div>
            </div>
          </div>
          <div class="card-body p-0 mt-3">
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Nhân sự</th>
                    <th>Loại nghỉ</th>
                    <th>Từ ngày</th>
                    <th>Đến ngày</th>
                    <th>Lý do</th>
                    <th>Trạng thái</th>
                    <th width="120">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="data-table">
                  <tr><td colspan="7"><div class="skeleton skeleton-text"></div></td></tr>
                </tbody>
              </table>
            </div>
            <div id="pagination-container" style="padding: 16px;"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui/toast.js"></script>
  <script src="/js/ui/modal.js"></script>
  <script src="/js/ui/confirm.js"></script>
  <script src="/js/ui/sidebar.js"></script>
  <script src="/js/ui/topbar.js"></script>
  <script src="/js/ui/pagination.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pages/leaves.js"></script>
</body>
</html>
