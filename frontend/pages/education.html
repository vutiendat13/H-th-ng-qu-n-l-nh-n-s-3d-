<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình độ — HDP-HRMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/modal.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  
  <div class="main-wrapper">
    <header id="topbar" class="topbar"></header>
    
    <main class="main-content">
      <div class="page-container">
        <div class="page-header">
          <h1 class="page-title">Quá trình Đào tạo & Trình độ</h1>
          <div class="page-actions">
            <button class="btn btn-primary" id="btn-add" data-role="ADMIN,HR">
              <i data-lucide="plus"></i> Thêm mới
            </button>
          </div>
        </div>
        
        <div class="card mb-4">
          <div class="card-body p-3 d-flex gap-3">
             <div style="flex: 1; max-width: 300px;">
              <select id="filter-employee" class="form-select">
                <option value="">-- Tất cả nhân sự --</option>
              </select>
             </div>
          </div>
        </div>
        
        <div class="card">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Nhân sự</th>
                    <th>Trình độ</th>
                    <th>Chuyên ngành</th>
                    <th>Cơ sở đào tạo</th>
                    <th>Năm tốt nghiệp</th>
                    <th width="100">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="data-table">
                  <tr><td colspan="6"><div class="skeleton skeleton-text"></div></td></tr>
                </tbody>
              </table>
            </div>
            <div id="pagination-container" style="padding: 16px;"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <div id="toast-container" class="toast-container"></div>
  <div id="modal-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui/toast.js"></script>
  <script src="/js/ui/modal.js"></script>
  <script src="/js/ui/confirm.js"></script>
  <script src="/js/ui/sidebar.js"></script>
  <script src="/js/ui/topbar.js"></script>
  <script src="/js/ui/pagination.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pages/education.js"></script>
</body>
</html>
