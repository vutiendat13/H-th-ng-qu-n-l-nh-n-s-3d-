<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quá trình Công tác — HDP-HRMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  
  <div class="main-wrapper">
    <header id="topbar" class="topbar"></header>
    
    <main class="main-content">
      <div class="page-container">
        <div class="page-header">
          <h1 class="page-title">Quá trình Công tác</h1>
        </div>
        
        <div class="card mb-4">
          <div class="card-body p-3 d-flex gap-3">
             <div style="flex: 1; max-width: 300px;">
              <select id="filter-employee" class="form-select">
                <option value="">-- Chọn nhân sự để xem --</option>
              </select>
             </div>
             <button class="btn btn-secondary" id="btn-toggle-view">
               <i data-lucide="list"></i> Chuyển đổi góc nhìn
             </button>
          </div>
        </div>
        
        <div class="card">
          <div class="card-body p-0">
            <div class="table-responsive" id="view-table">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Đơn vị</th>
                    <th>Chức vụ</th>
                    <th>Từ ngày</th>
                    <th>Đến ngày</th>
                    <th>Số quyết định</th>
                    <th>Ghi chú</th>
                  </tr>
                </thead>
                <tbody id="data-table">
                  <tr><td colspan="6" class="text-center py-4 text-muted">Vui lòng chọn nhân sự</td></tr>
                </tbody>
              </table>
            </div>
            
            <div id="view-timeline" class="hidden p-4">
               <div id="timeline-container" style="max-width: 600px; margin: 0 auto;"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <div id="toast-container" class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui/toast.js"></script>
  <script src="/js/ui/sidebar.js"></script>
  <script src="/js/ui/topbar.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pages/work-history.js"></script>
</body>
</html>
