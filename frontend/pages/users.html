<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài khoản — HDP-HRMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  
  <div class="main-wrapper">
    <header id="topbar" class="topbar"></header>
    
    <main class="main-content">
      <div class="page-container">
        <div class="page-header">
          <h1 class="page-title">Quản lý Tài khoản (Demo - Admin)</h1>
        </div>
        
        <div class="card">
          <div class="card-body">
            <div class="alert mb-4" style="background:var(--color-info-bg);color:var(--color-info);padding:16px;border-radius:var(--radius-md);border:1px solid var(--color-info);">
              Giao diện demo cho User Management. Giả lập API users (admin only).
            </div>
            
            <table class="data-table">
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Vai trò</th>
                  <th>Trạng thái</th>
                  <th>Đăng nhập cuối</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="font-medium">admin</td>
                  <td><span class="badge badge-success">ADMIN</span></td>
                  <td><span class="badge badge-success">Hoạt động</span></td>
                  <td>Vừa xong</td>
                </tr>
                <tr>
                  <td class="font-medium">hr_manager</td>
                  <td><span class="badge badge-warning">HR</span></td>
                  <td><span class="badge badge-success">Hoạt động</span></td>
                  <td>Hôm qua</td>
                </tr>
                <tr>
                  <td class="font-medium">viewer</td>
                  <td><span class="badge badge-info">VIEWER</span></td>
                  <td><span class="badge badge-neutral">Đã khóa</span></td>
                  <td>Tuần trước</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <div id="toast-container" class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui/toast.js"></script>
  <script src="/js/ui/sidebar.js"></script>
  <script src="/js/ui/topbar.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth()) return;
      if (!Auth.isAdmin()) {
        window.location.href = '/pages/dashboard.html';
      }
    });
  </script>
</body>
</html>
