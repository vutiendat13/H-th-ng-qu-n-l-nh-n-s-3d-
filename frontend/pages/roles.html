<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phân quyền — HDP-HRMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/modal.css">
  <link rel="stylesheet" href="/css/toast.css">
  <style>
    .role-grid { display: grid; grid-template-columns: 240px 1fr; gap: 24px; }
    .role-list { display: flex; flex-direction: column; gap: 8px; }
    .role-item { padding: 12px 16px; border-radius: var(--radius-md); border: 1px solid var(--color-border); cursor: pointer; transition: all var(--transition-fast); }
    .role-item:hover { background: var(--color-bg); }
    .role-item.active { background: var(--color-primary-100); border-color: var(--color-primary); color: var(--color-primary-dark); font-weight: 600; }
    .matrix-table th { text-align: center; }
    .matrix-table td { text-align: center; vertical-align: middle; }
    .matrix-table td:first-child { text-align: left; font-weight: 500; }
  </style>
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  
  <div class="main-wrapper">
    <header id="topbar" class="topbar"></header>
    
    <main class="main-content">
      <div class="page-container">
        <div class="page-header">
          <h1 class="page-title">Ma trận Phân quyền</h1>
          <div class="page-actions">
            <button class="btn btn-primary" id="btn-save">
              <i data-lucide="save"></i> Lưu phân quyền
            </button>
          </div>
        </div>
        
        <div class="role-grid">
          <div class="card">
            <div class="card-header"><h3 class="card-title">Vai trò</h3></div>
            <div class="card-body">
              <div class="role-list">
                <div class="role-item active" data-role="ADMIN">ADMIN (Quản trị)</div>
                <div class="role-item" data-role="HR">HR (Nhân sự)</div>
                <div class="role-item" data-role="VIEWER">VIEWER (Chỉ xem)</div>
              </div>
            </div>
          </div>
          
          <div class="card">
            <div class="card-header border-bottom-0">
              <h3 class="card-title" id="matrix-title">Quyền hạn của ADMIN</h3>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="data-table matrix-table">
                  <thead>
                    <tr>
                      <th>Module / Resource</th>
                      <th>Xem (View)</th>
                      <th>Thêm (Create)</th>
                      <th>Sửa (Edit)</th>
                      <th>Xóa (Delete)</th>
                    </tr>
                  </thead>
                  <tbody id="matrix-body">
                    <!-- JS renders checkboxes -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  
  <div id="toast-container" class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui/toast.js"></script>
  <script src="/js/ui/sidebar.js"></script>
  <script src="/js/ui/topbar.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pages/roles.js"></script>
</body>
</html>
