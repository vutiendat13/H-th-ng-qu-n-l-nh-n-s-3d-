<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cấu hình Hệ thống — HDP-HRMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>
  
  <div class="main-wrapper">
    <header id="topbar" class="topbar"></header>
    
    <main class="main-content">
      <div class="page-container">
        <div class="page-header">
          <h1 class="page-title">Cấu hình Hệ thống</h1>
        </div>
        
        <div class="card mb-4">
          <div class="card-header"><h3 class="card-title">Thông tin hệ thống</h3></div>
          <div class="card-body">
            <div class="form-grid-2">
              <div class="info-item">
                <div class="text-muted mb-1">Phiên bản</div>
                <div class="font-medium">1.0.0 (Release)</div>
              </div>
              <div class="info-item">
                <div class="text-muted mb-1">Cơ sở dữ liệu</div>
                <div class="font-medium text-success">Đã kết nối (MySQL)</div>
              </div>
              <div class="info-item">
                <div class="text-muted mb-1">API Backend</div>
                <div class="font-medium text-success">Đang hoạt động (Flask)</div>
              </div>
            </div>
          </div>
        </div>
        
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui/toast.js"></script>
  <script src="/js/ui/sidebar.js"></script>
  <script src="/js/ui/topbar.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth()) return;
      if (!Auth.isAdmin()) {
        window.location.href = '/pages/dashboard.html';
      }
    });
  </script>
</body>
</html>
